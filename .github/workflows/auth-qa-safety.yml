name: Cloudflare Auth QA safety checks

on:
  pull_request:
    paths:
      - 'scripts/verify-cloudflare-auth.mjs'
      - 'scripts/diagnose-production-d1-readonly.mjs'
      - 'scripts/incident-recover-sewak-final.mjs'
      - 'scripts/incident-recovery-contract.mjs'
      - 'scripts/deployment-readiness.mjs'
      - 'tests/d1/deployment-readiness.test.mjs'
      - 'tests/d1/incident-recovery.test.mjs'
      - 'worker/src/d1-diagnostics.ts'
      - 'worker/src/cloudflare-auth.ts'
      - 'worker/src/queries.ts'
      - 'tests/d1/d1-diagnostics.test.mjs'
      - 'tests/d1/d1-diagnostic-operator.test.mjs'
      - '.github/workflows/auth-qa-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify Auth QA script syntax (no live Cloudflare calls)
        run: |
          node --check scripts/verify-cloudflare-auth.mjs
          node --check scripts/incident-recover-sewak-final.mjs
      - name: Install exact dependencies
        run: |
          npm ci
          npm --prefix worker ci
      - name: Test Cloudflare deployment safeguards offline
        run: node --test tests/d1/operator.test.mjs tests/d1/d1-diagnostics.test.mjs tests/d1/d1-diagnostic-operator.test.mjs tests/d1/incident-recovery.test.mjs tests/d1/deployment-readiness.test.mjs
