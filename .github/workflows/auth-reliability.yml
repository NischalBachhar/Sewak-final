name: Authentication reliability
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'src/**'
      - 'tests/d1/**'
      - 'migrations/**'
      - 'scripts/*marketplace*.mjs'
      - 'tests/browser/auth-reliability.spec.cjs'
      - 'tests/browser/journeys.spec.cjs'
      - 'scripts/serve-d1-test.mjs'
      - 'playwright.auth.config.cjs'
      - '.github/workflows/auth-reliability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm --prefix worker ci
      - run: npm run typecheck
      - run: npm run test:d1
      - run: npm run test:unit -- --silent
      - run: npm run lint
      - run: npx playwright install --with-deps chrome firefox
      - run: npm run test:browser -- --config playwright.auth.config.cjs
      - name: Registration, approval, booking and security journeys
        run: npm run test:browser -- signup-ui.spec.cjs combined-organization.spec.cjs organization-moderation.spec.cjs journeys.spec.cjs --grep 'signup|combined organization|organization moderation|real D1 customer request|asset security|account switching|browser photo compression'
      - name: Caregiver previews, availability and discovery
        run: npm run test:browser -- caregiver-previews.spec.cjs zz-discovery.spec.cjs marketplace-ui.spec.cjs
      - name: New marketplace inbox and availability end-to-end journeys
        run: npm run test:browser -- marketplace-rebuild.spec.cjs marketplace-media.spec.cjs
      - run: npm run build:release
        env:
          REACT_APP_CANONICAL_ORIGIN: https://sewak-final.nischalbachhar9.workers.dev
      - run: npm run deploy:cloudflare -- --worker sewak-final --dry-run
        env:
          CLOUDFLARE_ACCOUNT_ID: 860970f755498a4fe10e16c2fa99ce55
          WRANGLER_SEND_METRICS: 'false'
      - run: node scripts/scan-release.mjs
