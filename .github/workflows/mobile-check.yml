name: Mobile checks

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"
  push:
    branches:
      - "mobile/cloudflare-production"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Expo dependency check
        run: npx expo-doctor
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo Android bundle check
        run: npx expo export --platform android --output-dir dist-ci
      - name: Production Worker health
        working-directory: .
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://sewak-final.nischalbachhar9.workers.dev';
          const response = await fetch(origin + '/api/health', { signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error('Production health returned HTTP ' + response.status);
          const body = await response.json();
          if (body.writesEnabled !== true) throw new Error('Production writes are not enabled.');
          console.log(JSON.stringify({ ok: true, writesEnabled: body.writesEnabled, auth: body.auth || null, worker: body.worker || null }));
          NODE
