name: Mobile checks

on:
  pull_request:
    paths:
      - "mobile/**"
      - "scripts/smoke-mobile-e2e-production.mjs"
      - "scripts/run-mobile-production-e2e.ps1"
      - ".github/workflows/mobile-check.yml"
  push:
    branches:
      - "mobile/cloudflare-production"
    paths:
      - "mobile/**"
      - "scripts/smoke-mobile-e2e-production.mjs"
      - ".github/workflows/mobile-check.yml"

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Expo dependency check
        run: npx expo-doctor
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo Android bundle check
        run: npx expo export --platform android --output-dir dist-ci
      - name: Production E2E runner syntax
        working-directory: .
        run: node --check scripts/smoke-mobile-e2e-production.mjs
      - name: Production activation wrapper syntax
        working-directory: .
        shell: pwsh
        run: "[scriptblock]::Create((Get-Content scripts/run-mobile-production-e2e.ps1 -Raw)) | Out-Null"
      - name: Inspect production deployment
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          if (!token) {
            console.log(JSON.stringify({ operatorCredentialAvailable: false }));
            process.exit(0);
          }
          const account = '860970f755498a4fe10e16c2fa99ce55';
          const base = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/workers/scripts/sewak-final';
          const headers = { Authorization: 'Bearer ' + token };
          const read = async (path) => {
            const response = await fetch(base + path, { headers, signal: AbortSignal.timeout(15000) });
            const body = await response.json();
            if (!response.ok || body.success === false) throw new Error('Cloudflare read failed: HTTP ' + response.status);
            return body.result;
          };
          const [settings, deployments] = await Promise.all([read('/settings'), read('/deployments')]);
          const writeBinding = settings.bindings?.find((item) => item.name === 'APP_WRITES_ENABLED');
          const versionId = deployments.deployments?.[0]?.versions?.[0]?.version_id || null;
          console.log(JSON.stringify({
            operatorCredentialAvailable: true,
            versionId,
            writesBinding: writeBinding?.text ?? writeBinding?.value ?? null,
          }));
          NODE
      - name: Production Worker health
        working-directory: .
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://sewak-final.nischalbachhar9.workers.dev';
          const response = await fetch(origin + '/api/health', { signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error('Production health returned HTTP ' + response.status);
          const body = await response.json();
          console.log(JSON.stringify({ ok: response.ok, writesEnabled: body.writesEnabled, auth: body.auth || null, worker: body.worker || null }));
          if (body.writesEnabled !== true) throw new Error('Production writes are not enabled.');
          NODE
